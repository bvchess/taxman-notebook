<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
<title id="title">The datasheet of the unsound mode</title>
<desc id="desc">The share of the 500 games of 4561-5060 with the proven score against the hours per 100 games, a point for each level of effort from 1 to 7, on 4 threads and on 64 threads, and the proven mode.</desc>

<style>
  :root { --surface: #ffffff; --ink: #1f2328; --muted: #59636e; --grid: #d1d9e0; --a: #2a78d6; --b: #eb6834; }
  @media (prefers-color-scheme: dark) { :root { --surface: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --grid: #3a3a38;
    --a: #3987e5; --b: #d95926; } }
  text { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--muted); }
  .ink { fill: var(--ink); } .title { font-size: 16px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
<text x="76.0" y="26.0" text-anchor="start" class="ink title">The share of optimal scores against the time (the 500 games of 4561-5060)</text>
<text x="76.0" y="46.0" text-anchor="start">Five chains of 100 games, a point for each level of effort (the number beside it), one seed, no game stops at a known score.</text>
<text x="76.0" y="62.0" text-anchor="start">Times alone on an idle machine, estimated from the chains: blue 4 threads, orange 64 threads (Part 2's speedups).</text>
<line class="grid" x1="76.0" x2="76.0" y1="124" y2="516"/>
<text x="76.0" y="534.0" text-anchor="middle">0.01 h</text>
<line class="grid" x1="262.0" x2="262.0" y1="124" y2="516"/>
<text x="262.0" y="534.0" text-anchor="middle">0.1 h</text>
<line class="grid" x1="448.0" x2="448.0" y1="124" y2="516"/>
<text x="448.0" y="534.0" text-anchor="middle">1 h</text>
<line class="grid" x1="634.0" x2="634.0" y1="124" y2="516"/>
<text x="634.0" y="534.0" text-anchor="middle">10 h</text>
<line class="grid" x1="820.0" x2="820.0" y1="124" y2="516"/>
<text x="820.0" y="534.0" text-anchor="middle">100 h</text>
<line class="grid" x1="76" x2="876" y1="516.0" y2="516.0"/>
<text x="68.0" y="520.0" text-anchor="end">85%</text>
<line class="grid" x1="76" x2="876" y1="385.3" y2="385.3"/>
<text x="68.0" y="389.3" text-anchor="end">90%</text>
<line class="grid" x1="76" x2="876" y1="254.7" y2="254.7"/>
<text x="68.0" y="258.7" text-anchor="end">95%</text>
<line class="grid" x1="76" x2="876" y1="124.0" y2="124.0"/>
<text x="68.0" y="128.0" text-anchor="end">100%</text>
<text x="476.0" y="566.0" text-anchor="middle">hours per 100 games (wall time, log axis)</text>
<text transform="translate(18 320) rotate(-90)" text-anchor="middle">games with the proven score</text>
<text x="84.0" y="508.0" text-anchor="start">The axis starts at 85%.  Effort 0 (5.6% of the games, 0.09 h on 4 threads) is below it.</text>
<polyline points="265.5,411.5 295.6,275.6 331.1,233.8 377.4,197.2 427.0,197.2 475.9,197.2 520.8,155.4" fill="none" stroke="var(--a)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="265.5" cy="411.5" r="4.5" fill="var(--a)" stroke="var(--surface)" stroke-width="2"/>
<text x="265.5" y="401.5" text-anchor="middle" class="ink">1</text>
<circle cx="295.6" cy="275.6" r="4.5" fill="var(--a)" stroke="var(--surface)" stroke-width="2"/>
<text x="295.6" y="265.6" text-anchor="middle" class="ink">2</text>
<circle cx="331.1" cy="233.8" r="4.5" fill="var(--a)" stroke="var(--surface)" stroke-width="2"/>
<text x="331.1" y="223.8" text-anchor="middle" class="ink">3</text>
<circle cx="377.4" cy="197.2" r="4.5" fill="var(--a)" stroke="var(--surface)" stroke-width="2"/>
<text x="377.4" y="187.2" text-anchor="middle" class="ink">4</text>
<circle cx="427.0" cy="197.2" r="4.5" fill="var(--a)" stroke="var(--surface)" stroke-width="2"/>
<text x="427.0" y="187.2" text-anchor="middle" class="ink">5</text>
<circle cx="475.9" cy="197.2" r="4.5" fill="var(--a)" stroke="var(--surface)" stroke-width="2"/>
<text x="475.9" y="187.2" text-anchor="middle" class="ink">6</text>
<circle cx="520.8" cy="155.4" r="4.5" fill="var(--a)" stroke="var(--surface)" stroke-width="2"/>
<text x="520.8" y="145.4" text-anchor="middle" class="ink">7</text>
<text x="532.8" y="159.4" text-anchor="start" class="ink">4 threads</text>
<polyline points="151.8,411.5 181.5,275.6 216.8,233.8 262.8,197.2 312.2,197.2 361.1,197.2 405.9,155.4" fill="none" stroke="var(--b)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="151.8" cy="411.5" r="4.5" fill="var(--b)" stroke="var(--surface)" stroke-width="2"/>
<text x="151.8" y="428.5" text-anchor="middle" class="ink">1</text>
<circle cx="181.5" cy="275.6" r="4.5" fill="var(--b)" stroke="var(--surface)" stroke-width="2"/>
<text x="181.5" y="292.6" text-anchor="middle" class="ink">2</text>
<circle cx="216.8" cy="233.8" r="4.5" fill="var(--b)" stroke="var(--surface)" stroke-width="2"/>
<text x="216.8" y="250.8" text-anchor="middle" class="ink">3</text>
<circle cx="262.8" cy="197.2" r="4.5" fill="var(--b)" stroke="var(--surface)" stroke-width="2"/>
<text x="262.8" y="214.2" text-anchor="middle" class="ink">4</text>
<circle cx="312.2" cy="197.2" r="4.5" fill="var(--b)" stroke="var(--surface)" stroke-width="2"/>
<text x="312.2" y="214.2" text-anchor="middle" class="ink">5</text>
<circle cx="361.1" cy="197.2" r="4.5" fill="var(--b)" stroke="var(--surface)" stroke-width="2"/>
<text x="361.1" y="214.2" text-anchor="middle" class="ink">6</text>
<circle cx="405.9" cy="155.4" r="4.5" fill="var(--b)" stroke="var(--surface)" stroke-width="2"/>
<text x="405.9" y="172.4" text-anchor="middle" class="ink">7</text>
<text x="417.9" y="159.4" text-anchor="start" class="ink">64 threads</text>
<line x1="413.4" x2="801.7" y1="124.0" y2="124.0" stroke="var(--ink)" stroke-width="2"/>
<path d="M687.6,117.0 l7,7 l-7,7 l-7,-7 z" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>
<text x="413.4" y="94.0" text-anchor="start" class="ink">proven mode, 88 threads: 100% of the games</text>
<text x="413.4" y="110.0" text-anchor="start">diamond: 19.4 h on average; bar: 0.65 h to 79.7 h over the five segments</text>
<circle cx="650" cy="446" r="4.5" fill="var(--a)"/>
<text x="662.0" y="450.0" text-anchor="start" class="ink">unsound mode on 4 threads</text>
<circle cx="650" cy="464" r="4.5" fill="var(--b)"/>
<text x="662.0" y="468.0" text-anchor="start" class="ink">unsound mode on 64 threads</text>
<circle cx="650" cy="482" r="4.5" fill="var(--ink)"/>
<text x="662.0" y="486.0" text-anchor="start" class="ink">proven mode on 88 threads</text>
</svg>
